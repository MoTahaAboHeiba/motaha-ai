<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoTaha AI</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    marked.setOptions({
      breaks: true,
      gfm: true,
    });
  </script>
  <style>
    :root {
      --bg: #0a0e17;
      --panel: #0d1117;
      --accent: #22D3EE;
      --muted: #64748b;
      --text: #e2e8f0;
      --border: rgba(34, 211, 238, 0.15);
      --bubble-user: #0f1e2e;
      --bubble-bot: #0d1117;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Cairo', system-ui, monospace;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
    }

    #app {
      width: min(1100px, 100%);
      height: min(92vh, 780px);
      border: 1px solid rgba(34, 211, 238, 0.12);
      border-radius: 12px;
      overflow: hidden;
      background: var(--bg);
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.8), 0 18px 40px rgba(15, 23, 42, 0.6);
      display: flex;
      flex-direction: column;
    }

    #portfolio-header {
      background: var(--panel);
      border-bottom: 1px solid rgba(34, 211, 238, 0.1);
      padding: 8px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      color: var(--accent);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-family: Arial, Helvetica, sans-serif;
    }

    .brand-divider {
      color: #1e3a4a;
      font-size: 12px;
    }

    .brand-subtitle {
      color: var(--muted);
      font-size: 12px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }

    .status-text {
      color: var(--muted);
      font-size: 11px;
      font-family: 'Courier New', monospace;
    }

    #chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px 16px;
      background: var(--bg);
      scroll-behavior: smooth;
    }

    .portfolio-message-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      width: 100%;
      margin: 10px 0;
    }

    .portfolio-message-row.user {
      justify-content: flex-end;
    }

    .portfolio-message {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .portfolio-message.user {
      align-items: flex-end;
    }

    .portfolio-message.bot {
      align-items: flex-start;
    }

    .portfolio-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(34, 211, 238, 0.1);
      border: 1px solid rgba(34, 211, 238, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
      margin-top: 2px;
      font-family: 'Courier New', monospace;
    }

    .portfolio-bubble {
      display: inline-block;
      max-width: 85%;
      padding: 14px 16px;
      font-size: 13px;
      line-height: 1.7;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      box-sizing: border-box;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .portfolio-bubble.bot {
      background: var(--bubble-bot);
      border: 1px solid rgba(34, 211, 238, 0.08);
      border-left: 2px solid var(--accent);
      border-radius: 0 8px 8px 8px;
    }

    .portfolio-bubble.user {
      background: var(--bubble-user);
      border: 1px solid rgba(34, 211, 238, 0.15);
      border-right: 2px solid var(--accent);
      border-radius: 8px 0 8px 8px;
      max-width: 70%;
    }

    .portfolio-bubble p,
    .portfolio-bubble strong,
    .portfolio-bubble a,
    .portfolio-bubble li,
    .portfolio-bubble span {
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.7;
    }

    .portfolio-bubble strong {
      color: var(--accent);
    }

    .portfolio-bubble a {
      color: var(--accent);
      text-decoration: none;
    }

    #composer {
      border-top: 1px solid rgba(34, 211, 238, 0.1);
      background: var(--panel);
      padding: 10px 20px 12px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }

    #chat-input {
      flex: 1;
      min-height: 42px;
      max-height: 120px;
      resize: vertical;
      border: 1px solid rgba(34, 211, 238, 0.15);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 14px;
      outline: none;
    }

    #chat-input:focus {
      border-color: rgba(34, 211, 238, 0.35);
      box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.08);
    }

    #send-button {
      border: 1px solid rgba(34, 211, 238, 0.25);
      background: rgba(34, 211, 238, 0.08);
      color: var(--accent);
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    #send-button:hover:not(:disabled) {
      border-color: rgba(34, 211, 238, 0.45);
      background: rgba(34, 211, 238, 0.12);
    }

    #send-button:disabled,
    #chat-input:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .example-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 20px 10px;
      background: var(--bg);
    }

    .example-pill {
      background: transparent;
      border: 1px solid rgba(34, 211, 238, 0.15);
      border-radius: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
      padding: 0 12px;
      min-height: 32px;
      height: 32px;
      flex: 0 0 auto;
      box-shadow: none;
      cursor: pointer;
    }

    .example-pill:hover {
      border-color: rgba(34, 211, 238, 0.35);
      color: var(--accent);
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb {
      background: rgba(34, 211, 238, 0.18);
      border-radius: 4px;
    }

    .bot-bubble p {
        margin: 0 0 8px 0;
    }
    .bot-bubble p:last-child {
        margin-bottom: 0;
    }
    .bot-bubble ul,
    .bot-bubble ol {
        margin: 4px 0 8px 0;
        padding-left: 20px;
    }
    .bot-bubble li {
        margin-bottom: 4px;
    }
    .bot-bubble strong {
        color: #22D3EE;
    }
    .bot-bubble code {
        background: rgba(34, 211, 238, 0.1);
        color: #22D3EE;
        padding: 1px 5px;
        border-radius: 3px;
        font-size: 0.9em;
    }

    .source-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid rgba(34, 211, 238, 0.15);
    }
    .source-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid rgba(34, 211, 238, 0.15);
    }
    .source-chip-group {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
    }
    .source-chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 0.72rem;
        font-family: monospace;
        color: #22D3EE;
        background: rgba(34, 211, 238, 0.08);
        border: 1px solid rgba(34, 211, 238, 0.25);
        border-radius: 4px;
        padding: 2px 8px;
        white-space: nowrap;
        letter-spacing: 0.03em;
        text-decoration: none;
        transition: all 0.2s ease;
    }
    .source-chip-name {
        background: rgba(34, 211, 238, 0.03);
        border-color: rgba(34, 211, 238, 0.15);
        color: #dbeafe;
    }
    .source-chip-link {
        cursor: pointer;
    }
    .source-chip-link:hover {
        background: rgba(34, 211, 238, 0.14);
        border-color: rgba(34, 211, 238, 0.45);
    }
    [dir="rtl"] {
        font-family: 'Cairo', system-ui, sans-serif;
        line-height: 1.8;
    }
    [dir="rtl"] .source-chips {
        direction: rtl;
    }
    [dir="rtl"] ul,
    [dir="rtl"] ol {
        padding-left: 0;
        padding-right: 20px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="portfolio-header">
      <div class="brand">
        <span class="brand-mark">// MOTAHA AI</span>
        <span class="brand-divider">|</span>
        <span class="brand-subtitle">Ask me anything about my engineering work</span>
      </div>
      <div class="status-pill">
        <span class="status-dot"></span>
        <span class="status-text">taha@portfolio ~</span>
      </div>
    </div>

    <div class="example-row">
      <button class="example-pill">Who are you?</button>
      <button class="example-pill">How does your Lakehouse work?</button>
      <button class="example-pill">What certifications do you hold?</button>
      <button class="example-pill">Explain your experience in Data Engineering</button>
      <button class="example-pill">Explain your experience in AI Engineering</button>
    </div>

    <div id="chat-log"></div>

    <div id="composer">
      <textarea id="chat-input" rows="1" placeholder="Ask me about my projects, decisions, or background..."></textarea>
      <button id="send-button">Send</button>
    </div>
  </div>

  <script>
    const API_BASE = "";
    // Change to your Koyeb URL before deploying

    const STARTUP_MESSAGE = "Hey, I'm Taha. Ask me anything about my engineering work — projects, technical decisions, architecture choices, or what I can bring to your team.\n\nأو كلمني بالعربي وأنا هرد عليك بالمصري.";
    const state = {
      history: [{ role: "assistant", content: STARTUP_MESSAGE }],
    };
    let streaming = false;

    function isArabic(text) {
        return /[\u0600-\u06FF]/.test(text);
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function normalizeMarkdownForDisplay(text) {
      return String(text)
        .replace(/:\s*-\s*/g, ":\n\n- ")
        .replace(/([.!?])\s*-\s*/g, "$1\n\n- ")
        .replace(/([.!?])\s+(?=\*\*)/g, "$1\n\n");
    }

    function renderMessage(role, content, sources = []) {
      if (role === "user") {
        const safe = escapeHtml(content).replace(/\n/g, "<br>");
        const rtlStyle = isArabic(content) ? ' dir="rtl" style="text-align: right;"' : "";
        return `
          <div class="portfolio-message-row user">
            <div class="portfolio-message user">
              <div class="portfolio-bubble user"${rtlStyle}>${safe}</div>
            </div>
          </div>
        `;
      }
      const normalized = normalizeMarkdownForDisplay(content);
      const rendered = typeof marked !== "undefined" ? marked.parse(normalized) : escapeHtml(normalized).replace(/\n/g, "<br>");
      const sourceMarkup = sources && sources.length
        ? `<div class="source-chips">${sources.map(source => {
            const label = typeof source === "string" ? source : (source.label || source.display_name || source.name || "Source");
            const githubUrl = typeof source === "string" ? "" : (source.github_url || source.url || "");
            const portfolioUrl = typeof source === "string" ? "#projects" : (source.portfolio_url || "#projects");
            const group = document.createElement("div");
            group.className = "source-chip-group";
            const name = document.createElement("span");
            name.className = "source-chip source-chip-name";
            name.textContent = formatSourceLabel(label);
            group.appendChild(name);
            if (githubUrl) {
              const githubLink = document.createElement("a");
              githubLink.href = githubUrl;
              githubLink.target = "_blank";
              githubLink.rel = "noopener noreferrer";
              githubLink.className = "source-chip source-chip-link";
              githubLink.textContent = "GitHub";
              group.appendChild(githubLink);
            }
            const portfolioBtn = document.createElement("button");
            portfolioBtn.type = "button";
            portfolioBtn.className = "source-chip source-chip-link";
            portfolioBtn.textContent = "Portfolio";
            portfolioBtn.addEventListener("click", () => {
              if (portfolioUrl && portfolioUrl.startsWith('#')) {
                goToPortfolioSection();
              } else if (portfolioUrl) {
                window.open(portfolioUrl, '_blank', 'noopener,noreferrer');
              }
            });
            group.appendChild(portfolioBtn);
            return group.outerHTML;
          }).join("")}</div>`
        : "";
      return `
        <div class="portfolio-message-row bot">
          <div class="portfolio-avatar">MT</div>
          <div class="portfolio-message bot">
            <div class="portfolio-bubble bot bot-bubble">${rendered}${sourceMarkup}</div>
          </div>
        </div>
      `;
    }

    function applyMessageDirectionality() {
      const log = document.getElementById("chat-log");
      if (!log) return;

      log.querySelectorAll(".portfolio-bubble.user").forEach((bubble) => {
        const messageText = bubble.textContent || "";
        if (isArabic(messageText)) {
          bubble.setAttribute("dir", "rtl");
          bubble.style.textAlign = "right";
        }
      });

      log.querySelectorAll(".portfolio-bubble.bot").forEach((bubble) => {
        const messageText = bubble.textContent || "";
        if (isArabic(messageText)) {
          bubble.setAttribute("dir", "rtl");
          bubble.style.textAlign = "right";
        }
      });
    }

    function renderHistory() {
      const log = document.getElementById("chat-log");
      if (!log) return;
      log.innerHTML = state.history.map(item => renderMessage(item.role, item.content, item.sources || [])).join("");
      applyMessageDirectionality();
      scrollToBottom();
    }

    function scrollToBottom() {
      const log = document.getElementById("chat-log");
      if (!log) return;
      log.scrollTop = log.scrollHeight;
    }

    function setLoading(isLoading) {
      const input = document.getElementById("chat-input");
      const button = document.getElementById("send-button");
      if (!input || !button) return;
      input.disabled = isLoading;
      button.disabled = isLoading;
    }

    let streamBuffer = "";

    function formatSourceLabel(source) {
      const label = typeof source === "string" ? source : (source.label || source.display_name || source.name || "Source");
      return String(label)
        .replace(/\.md$/i, "")
        .replace(/-/g, " ")
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    function goToPortfolioSection() {
      const target = window.parent && window.parent !== window
        ? window.parent.document.querySelector('#projects, [id="projects"]')
        : document.querySelector('#projects, [id="projects"]');

      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }

      const currentHash = window.location.hash || '#projects';
      if (window.parent && window.parent !== window) {
        window.parent.location.hash = currentHash;
      } else {
        window.location.hash = '#projects';
      }
    }

    function renderSources(bubble, sources) {
      if (!sources || sources.length === 0) return;
      const container = document.createElement("div");
      container.className = "source-chips";
      if (bubble.getAttribute("dir") === "rtl") {
        container.style.justifyContent = "flex-end";
      }

      sources.forEach(src => {
        const label = typeof src === "string"
          ? src
          : (src.label || src.display_name || src.name || "Source");
        const githubUrl = typeof src === "string" ? "" : (src.github_url || src.url || "");
        const portfolioUrl = typeof src === "string" ? "#projects" : (src.portfolio_url || "#projects");

        const group = document.createElement("div");
        group.className = "source-chip-group";

        const name = document.createElement("span");
        name.className = "source-chip source-chip-name";
        name.textContent = formatSourceLabel(label);
        group.appendChild(name);

        if (githubUrl) {
          const githubLink = document.createElement("a");
          githubLink.href = githubUrl;
          githubLink.target = "_blank";
          githubLink.rel = "noopener noreferrer";
          githubLink.className = "source-chip source-chip-link";
          githubLink.textContent = "GitHub";
          group.appendChild(githubLink);
        }

        const portfolioBtn = document.createElement("button");
        portfolioBtn.type = "button";
        portfolioBtn.className = "source-chip source-chip-link";
        portfolioBtn.textContent = "Portfolio";
        portfolioBtn.addEventListener("click", () => {
          if (portfolioUrl && portfolioUrl.startsWith('#')) {
            goToPortfolioSection();
          } else if (portfolioUrl) {
            window.open(portfolioUrl, '_blank', 'noopener,noreferrer');
          }
        });
        group.appendChild(portfolioBtn);

        container.appendChild(group);
      });
      bubble.appendChild(container);
    }

    async function streamChat(message, history) {
      streamBuffer = "";
      let responseSources = [];
      const bubble = document.getElementById("streaming-bubble");
      const response = await fetch(`${API_BASE}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, history }),
      });
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      const flushBufferedEvents = () => {
        let eventBoundary;
        while ((eventBoundary = buffer.indexOf("\n\n")) !== -1) {
          const event = buffer.slice(0, eventBoundary);
          buffer = buffer.slice(eventBoundary + 2);

          const lines = event.split(/\r?\n/);
          for (const line of lines) {
            if (!line.startsWith("data:")) continue;
            const chunk = line.slice(5).trimStart();
            if (chunk === "[DONE]") {
              if (bubble) {
                bubble.innerHTML = marked.parse(normalizeMarkdownForDisplay(streamBuffer));
                if (isArabic(streamBuffer)) {
                  bubble.setAttribute("dir", "rtl");
                  bubble.style.textAlign = "right";
                }
                renderSources(bubble, responseSources);
              }
              return { streamBuffer, responseSources };
            }
            if (chunk.startsWith("[SOURCES]")) {
              try {
                const parsed = JSON.parse(chunk.slice(9));
                responseSources = Array.isArray(parsed) ? parsed : [];
              } catch (e) {
                responseSources = [];
              }
              continue;
            }
            streamBuffer += chunk;
            if (bubble) {
              bubble.innerHTML = marked.parse(normalizeMarkdownForDisplay(streamBuffer));
              bubble.scrollIntoView({ behavior: "smooth", block: "end" });
            }
          }
        }
      };

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const result = flushBufferedEvents();
        if (result) {
          return result;
        }
      }

      if (buffer.trim()) {
        const lines = buffer.split(/\r?\n/);
        for (const line of lines) {
          if (!line.startsWith("data:")) continue;
          const chunk = line.slice(5).trimStart();
          if (chunk === "[DONE]") {
            if (bubble) {
              bubble.innerHTML = marked.parse(normalizeMarkdownForDisplay(streamBuffer));
              if (isArabic(streamBuffer)) {
                bubble.setAttribute("dir", "rtl");
                bubble.style.textAlign = "right";
              }
              renderSources(bubble, responseSources);
            }
            return { streamBuffer, responseSources };
          }
          if (chunk.startsWith("[SOURCES]")) {
            try {
              const parsed = JSON.parse(chunk.slice(9));
              responseSources = Array.isArray(parsed) ? parsed : [];
            } catch (e) {
              responseSources = [];
            }
            continue;
          }
          streamBuffer += chunk;
        }
      }

      if (bubble) {
        bubble.innerHTML = marked.parse(normalizeMarkdownForDisplay(streamBuffer));
        if (isArabic(streamBuffer)) {
          bubble.setAttribute("dir", "rtl");
          bubble.style.textAlign = "right";
        }
        renderSources(bubble, responseSources);
      }
      return { streamBuffer, responseSources };
    }

    async function submitPrompt() {
      const input = document.getElementById("chat-input");
      if (!input || streaming) return;

      const message = input.value.trim();
      if (!message) return;

      streaming = true;
      setLoading(true);
      state.history.push({ role: "user", content: message });
      renderHistory();

      const log = document.getElementById("chat-log");
      const botRow = document.createElement("div");
      botRow.className = "portfolio-message-row bot";
      botRow.innerHTML = `
        <div class="portfolio-avatar">MT</div>
        <div class="portfolio-message bot">
          <div id="streaming-bubble" class="portfolio-bubble bot bot-bubble"></div>
        </div>
      `;
      log.appendChild(botRow);
      scrollToBottom();

      try {
        const historySnapshot = state.history.slice();
        const finalResult = await streamChat(message, historySnapshot);
        const bubble = document.getElementById("streaming-bubble");
        if (bubble) bubble.id = "";
        state.history.push({
          role: "assistant",
          content: (finalResult?.streamBuffer || streamBuffer).trim() || "",
          sources: finalResult?.responseSources || [],
        });
        renderHistory();
      } catch (error) {
        const bubble = document.getElementById("streaming-bubble");
        if (bubble) {
          bubble.id = "";
          bubble.textContent = "Something went wrong on my end. Try again in a moment.";
        }
        state.history.push({ role: "assistant", content: "Something went wrong on my end. Try again in a moment." });
        renderHistory();
      } finally {
        setLoading(false);
        streaming = false;
        input.value = "";
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const input = document.getElementById("chat-input");
      const button = document.getElementById("send-button");
      const pills = document.querySelectorAll(".example-pill");

      renderHistory();

      button.addEventListener("click", submitPrompt);
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          submitPrompt();
        }
      });

      pills.forEach((pill) => {
        pill.addEventListener("click", () => {
          if (streaming) return;
          input.value = pill.textContent.trim();
          submitPrompt();
        });
      });
    });
  </script>
</body>
</html>
